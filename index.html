<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Ayman’s Library — a personal space for reading, thinking and writing.">
  <title>Ayman’s Library</title>
  <link rel="stylesheet" href="styles.css?v=0.9">
  <script src="portal-model.js?v=0.9" defer></script>
  <script src="app.js?v=0.9" defer></script>
</head>
<body>
  <header class="page-header">
    <fieldset class="theme-picker" aria-label="Appearance">
      <legend class="sr-only">Appearance</legend>
      <label><input type="radio" name="theme" value="system"><span>System</span></label>
      <label><input type="radio" name="theme" value="light"><span>Light</span></label>
      <label><input type="radio" name="theme" value="dark" checked><span>Dark</span></label>
    </fieldset>
  </header>
  <main class="portal" aria-label="Library portal">
    <section class="brand" aria-labelledby="brand-title">
      <svg class="brand-icon" viewBox="0 0 96 80" fill="none" aria-hidden="true">
        <path d="M48 12C33 1 13 3 6 10v61c12-8 28-7 42 2 14-9 30-10 42-2V10C77 2 61 2 48 12Zm0 0v61" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
      <h1 id="brand-title">Ayman’s Library</h1>
      <p class="tagline">Read. Think. Write.</p>
      <div class="brand-light" aria-hidden="true"></div>
    </section>
    <section class="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">Welcome back</h2>
      <form id="portal-form">
        <label for="destination">Open</label>
        <div class="select-wrap">
          <select id="destination" name="destination">
            <option value="library">My Library</option>
            <option value="writing">Writing Workspace</option>
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </div>
        <label for="portal-password">Password</label>
        <input id="portal-password" name="password" type="password" autocomplete="current-password" required aria-describedby="connection-status">
        <button class="enter-button" type="submit" disabled>Enter</button>
        <p id="connection-status" class="connection-status" role="status">Preparing secure Google connection…</p>
      <p class="connection-note">Your private password file and books stay in Google Drive. Enter connects Google when needed.</p>
        <details class="portal-config"><summary>Connection settings</summary><label for="portal-client">Web client ID</label><input id="portal-client" autocomplete="off" spellcheck="false"><label for="portal-folder">Library folder URL or ID (optional)</label><input id="portal-folder" autocomplete="off"><label for="portal-password-file">Password file URL or ID (optional)</label><input id="portal-password-file" autocomplete="off"></details>
      </form>
    </section>
  </main>
<section id="portal-shell" hidden aria-label="Connected workspace"><header class="session-bar"><button id="portal-home">Portal</button><span id="session-space"></span><span id="session-state" role="status">Google connected</span><button id="portal-lock">Lock</button></header><iframe id="workspace-frame" title="My Office workspace" referrerpolicy="same-origin"></iframe></section>
</body>
</html>
